name: Hotel App APK Builder
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # هذا السطر يتيح لك تشغيله يدوياً في أي وقت
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
    - run: chmod +x gradlew
    - run: ./gradlew assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: Hotel-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
